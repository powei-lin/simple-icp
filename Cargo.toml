[package]
name = "simple-icp"
version = "0.2.0"
edition = "2021"
authors = ["Powei Lin <poweilin1994@gmail.com>"]
description = "Kiss icp in pure rust"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/powei-lin/simple-icp"
repository = "https://github.com/powei-lin/simple-icp"

[dependencies]
nalgebra = "0.34.1"
rayon = "1.10.0"
serde = { version = "1.0.209", features = ["derive"] }
tiny-solver = "0.18.0"

[dev-dependencies]
clap = { version = "4.5.53", features = ["derive"] }
colorous = "1.0.16"
rerun = "0.27.2"
unbag-rs = "0.1.1"
